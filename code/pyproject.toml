[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "peca-colorization"
version = "1.0.0"
description = "Palette Context Assisted inference for test-time paint-bucket colourisation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Dongheng Lin"},
  {name = "Jianbo Jiao"},
]
keywords = ["animation", "colourisation", "computer-vision", "paint-bucket"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
  "PyYAML>=6",
  "scikit-image>=0.22",
  "scipy>=1.10",
  "torch>=2.5.1",
  "torchvision>=0.20.1",
  "tqdm>=4.65",
]

[project.optional-dependencies]
wandb = ["wandb>=0.19"]
timm = ["timm>=1.0", "huggingface-hub>=0.27"]
sam2 = [
  "huggingface-hub>=0.27",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]
sd = ["accelerate>=1.0", "diffusers>=0.31", "safetensors>=0.4", "transformers>=4.46"]
dev = ["pytest>=8", "ruff>=0.9"]
all = [
  "accelerate>=1.0",
  "diffusers>=0.31",
  "huggingface-hub>=0.27",
  "safetensors>=0.4",
  "timm>=1.0",
  "transformers>=4.46",
  "wandb>=0.19",
  "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[project.urls]
Homepage = "https://rathgrith.github.io/PeCA/"
Repository = "https://github.com/Rathgrith/PeCA"
Report = "https://api.wandb.ai/links/505029658/9dcpgyo2"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "F403", "F405"]
