name: peca
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.19
  - git
  - ca-certificates
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.9.1
      - torchvision==0.24.1
      - numpy==2.2.6
      - pillow==12.1.0
      - PyYAML==6.0.3
      - scikit-image==0.25.2
      - scipy==1.15.3
      - timm==1.0.22
      - tqdm==4.65.2
      - wandb==0.23.0
      - "-e .[sam2]"
